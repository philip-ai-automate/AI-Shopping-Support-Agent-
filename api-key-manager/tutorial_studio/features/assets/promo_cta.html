<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1440px; height:900px; overflow:hidden;
    background: radial-gradient(circle at 70% 80%, #0c2333 0%, #030C18 55%, #01060c 100%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap { text-align:center; color:#fff; }
  .logo {
    font-size:26px; font-weight:800; letter-spacing:0.5px; color:#8fa6b8;
    opacity:0; animation: fadeUp 0.6s ease-out 0.1s forwards;
  }
  .logo b { color:#fff; }
  .logo span { color:#25D366; }
  .wa-icon {
    margin:26px auto 0; width:96px; height:96px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
    opacity:0; animation: popIn 0.55s cubic-bezier(.2,1.4,.4,1) 0.6s forwards;
    box-shadow:0 0 0 0 rgba(37,211,102,0.5);
  }
  .wa-icon svg { width:52px; height:52px; }
  .headline {
    margin-top:26px; font-size:40px; font-weight:800; color:#fff;
    opacity:0; animation: fadeUp 0.6s ease-out 1.2s forwards;
  }
  .instructions {
    margin-top:18px; font-size:22px; color:#cfe3ee;
    opacity:0; animation: fadeUp 0.6s ease-out 1.7s forwards;
  }
  .instructions b { color:#25D366; }
  .number {
    margin-top:22px; display:inline-block; padding:18px 40px; border-radius:16px;
    background:rgba(37,211,102,0.1); border:2px solid #25D366;
    font-size:46px; font-weight:800; letter-spacing:1px; color:#fff;
    opacity:0; animation: fadeUp 0.6s ease-out 2.2s forwards;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes popIn {
    0%   { opacity:0; transform:scale(0.8); }
    100% { opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Phi<b>X</b><span>tra</span></div>
    <div class="wa-icon">

    </div>
    <div class="headline">Reserve Your Free Spot</div>
    <div class="instructions">Send the word <b>RESERVE</b> on WhatsApp to</div>
    <div class="number">+44 7467 786954</div>
  </div>
</body>
</html>
