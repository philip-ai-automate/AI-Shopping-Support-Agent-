<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#030C18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .card{max-width:380px;margin:24px;text-align:center;padding:36px 28px;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px}
    .tick{width:56px;height:56px;border-radius:50%;background:#12b76a;color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
    h1{font-size:19px;margin:0 0 10px}
    p{font-size:14px;color:rgba(255,255,255,0.65);margin:0;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Payment received</h1>
    <p>Thanks! You can close this tab and go back to your WhatsApp chat —
      you'll get a confirmation message there shortly.</p>
  </div>
</body>
</html>
