{% extends "portal/base.html" %}
{% block title %}{{ 'Edit' if department else 'New' }} Department — PhiXtra Portal{% endblock %}

{% block content %}
<div class="page" style="max-width:420px">

  <div class="page-header">
    <h1 class="section-title">{{ 'Edit Department' if department else 'New Department' }}</h1>
    <a href="{{ url_for('portal.team_departments_page') }}" class="btn btn-sm">← Back</a>
  </div>

  <form method="POST"
        action="{{ url_for('portal.team_department_edit', dept_id=department.id) if department else url_for('portal.team_department_new') }}">
    <div class="card">
      <div class="form-group">
        <label>Department name</label>
        <input type="text" name="name" required maxlength="100" placeholder="e.g. Sales, Support, Marketing"
               value="{{ department.name if department else '' }}"/>
      </div>
    </div>
    <div style="margin-top:16px">
      <button type="submit" class="btn btn-primary">{{ 'Save' if department else 'Create Department' }}</button>
      <a href="{{ url_for('portal.team_departments_page') }}" class="btn">Cancel</a>
    </div>
  </form>

</div>
{% endblock %}
