{# Shared by Social Posts › Content and › Published (2026-09-26). #}
<style>
  .sl-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .sl-person{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink)}
  .sl-person select{font:inherit;font-size:13px;font-weight:500;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .sl-flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .sl-flow .sl-arrow{color:#98A2B3}
  .sl-auto{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#6941C6;background:#F4F3FF;border-radius:6px;padding:1px 6px}
  .sl-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow-x:auto}
  .sl-table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
  .sl-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .sl-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .sl-table tr:last-child td{border-bottom:0}
  .sl-post{display:flex;gap:10px;align-items:center;min-width:220px}
  .sl-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#F2F4F7;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9.5px;text-align:center;line-height:1.1}
  .sl-title{font-weight:650;color:var(--ink);text-decoration:none;line-height:1.35}
  .sl-title:hover{text-decoration:underline}
  .sl-sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sl-late{color:#B42318;font-weight:700}
  .sl-note{font-size:12px;color:#B42318;margin-top:4px;line-height:1.4;max-width:46ch}
  .sl-acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
  .sl-acts form{margin:0}
  .sl-nw{white-space:nowrap;font-variant-numeric:tabular-nums}
  .sl-accts{display:flex;gap:4px;flex-wrap:wrap}
  .sl-acct{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap;color:var(--txt);text-decoration:none}
  a.sl-acct:hover{background:#F5F7FA}
  .sl-acct.bad{border-color:rgba(180,35,24,.3);color:#B42318;background:#FEF3F2}
  .sl-dot{width:8px;height:8px;border-radius:3px;display:inline-block;flex-shrink:0}
  .sl-pages{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12.5px;color:var(--muted)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
