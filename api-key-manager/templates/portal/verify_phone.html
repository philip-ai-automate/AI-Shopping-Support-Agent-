<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your phone — PhiXtra</title>
  <style>
    :root{
      --ink:#030C18; --bg:#F7F8FA; --card:#fff;
      --line:rgba(3,12,24,0.10); --txt:rgba(3,12,24,0.92);
      --muted:rgba(3,12,24,0.55); --good:#12B76A; --accent:#3ddc84;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
    a{color:var(--ink)}
    a:hover{text-decoration:underline}
    input[type=text]{
      width:100%;font-size:22px;font-weight:700;letter-spacing:6px;text-align:center;
      padding:14px 12px;border:1px solid var(--line);border-radius:10px;color:var(--txt);
      background:#fff;
    }
    input[type=text]:focus{outline:none;border-color:var(--accent)}
    button{cursor:pointer;border:none}
  </style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 40px">

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:22px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M4 4h9a5 5 0 0 1 0 10H8v6H4V4z" fill="var(--ink)"/>
      <path d="M20 4 6 20" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <span style="font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--ink)">PhiXtra</span>
  </div>

  <div style="width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(3,12,24,0.10);padding:38px 34px 32px;text-align:center">

    <div style="width:56px;height:56px;border-radius:50%;background:rgba(18,183,106,0.10);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="1.8">
        <rect x="7" y="2" width="10" height="20" rx="2"/>
        <path d="M11 18h2"/>
      </svg>
    </div>

    <h1 style="font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0 0 10px;line-height:1.3">Verify your phone</h1>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 6px">
      We've sent a 6-digit code by text message to
    </p>
    <p style="font-size:14px;font-weight:700;color:var(--txt);margin:0 0 22px">{{ phone }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="text-align:left;font-size:12.5px;line-height:1.6;padding:10px 14px;border-radius:10px;margin-bottom:16px;
            {% if category == 'success' %}background:rgba(18,183,106,0.10);color:#0b7a45;
            {% elif category == 'danger' %}background:rgba(220,38,38,0.08);color:#b91c1c;
            {% else %}background:rgba(3,12,24,0.04);color:var(--muted);{% endif %}">
            {{ message | safe }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('portal.register_verify_phone') }}">
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             placeholder="000000" autofocus autocomplete="one-time-code" required
             style="margin-bottom:18px">
      <button type="submit" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:#fff;border-radius:10px;padding:13px 18px;font-size:14.5px;font-weight:700">
        Verify code
      </button>
    </form>

    <form method="POST" action="{{ url_for('portal.register_resend_phone_otp') }}" style="margin-top:14px">
      <button type="submit" style="background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:4px">
        Didn't get it? Send a new code
      </button>
    </form>

    <p style="margin:18px 0 0;font-size:12.5px;color:var(--muted)">
      Code expires in 10 minutes.
    </p>
  </div>
</div>
</body>
</html>
