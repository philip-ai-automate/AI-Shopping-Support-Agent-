{% extends "portal/admin_base.html" %}
{% block title %}Video Tutorials — PhiXtra Admin{% endblock %}

{% block content %}
<style>
.vt-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:18px;
}
.vt-card {
  background:#fff; border:1px solid var(--line); border-radius:14px;
  overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.vt-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(3,12,24,.08) }
.vt-thumb { position:relative; aspect-ratio:16/9; background:#0b1220 }
.vt-thumb img { width:100%; height:100%; object-fit:cover; display:block }
.vt-play {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(3,12,24,.15); transition:background .15s;
}
.vt-card:hover .vt-play { background:rgba(3,12,24,.35) }
.vt-play-btn {
  width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.95);
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.25);
  flex-shrink:0;
}
.vt-play-btn svg { margin-left:3px }
.vt-info { padding:12px 14px }
.vt-title { font-size:13px; font-weight:800; line-height:1.3 }
.vt-sub {
  font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.vt-audience {
  display:inline-block; font-size:9px; font-weight:800; letter-spacing:.03em;
  text-transform:uppercase; padding:2px 7px; border-radius:999px; margin-top:6px;
  background:rgba(3,12,24,.06); color:var(--muted);
}

.vt-modal {
  display:none; position:fixed; inset:0; background:rgba(3,12,24,.75); z-index:9999;
  align-items:center; justify-content:center; padding:24px;
}
.vt-modal.open { display:flex }
.vt-modal-inner { width:100%; max-width:860px }
.vt-modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px }
.vt-modal-title { color:#fff; font-size:15px; font-weight:800 }
.vt-modal-close {
  background:rgba(255,255,255,.12); border:none; color:#fff; width:30px; height:30px;
  border-radius:50%; cursor:pointer; font-size:16px; line-height:1;
}
.vt-modal video { width:100%; border-radius:10px; display:block; background:#000 }
</style>

<div class="page-header">
  <div class="section-title">Video Tutorials</div>
</div>

<div class="vt-grid">
  {% for v in videos %}
  <div class="vt-card" data-slug="{{ v.slug }}" data-title="{{ v.title }}">
    <div class="vt-thumb">
      <img src="{{ url_for('static', filename='portal/tutorial/thumbs/' ~ v.slug ~ '.jpg') }}" alt="{{ v.title }}" loading="lazy">
      <div class="vt-play">
        <div class="vt-play-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#030C18"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    </div>
    <div class="vt-info">
      <div class="vt-title">{{ v.title }}</div>
      <div class="vt-sub">{{ v.sub }}</div>
      <div class="vt-audience">{{ v.audience }}</div>
    </div>
  </div>
  {% endfor %}
</div>

<div class="vt-modal" id="vtModal">
  <div class="vt-modal-inner">
    <div class="vt-modal-head">
      <div class="vt-modal-title" id="vtModalTitle"></div>
      <button class="vt-modal-close" id="vtModalClose">&times;</button>
    </div>
    <video id="vtModalVideo" controls></video>
  </div>
</div>

<script>
(function() {
  var modal = document.getElementById('vtModal');
  var video = document.getElementById('vtModalVideo');
  var titleEl = document.getElementById('vtModalTitle');
  var videoBase = "{{ url_for('static', filename='portal/tutorial/videos/') }}";

  function open(slug, title) {
    titleEl.textContent = title;
    video.src = videoBase + slug + "-tutorial.mp4?v=" + Date.now();
    modal.classList.add('open');
    video.play();
  }
  function close() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    modal.classList.remove('open');
  }

  document.querySelectorAll('.vt-card').forEach(function(card) {
    card.addEventListener('click', function() {
      open(card.dataset.slug, card.dataset.title);
    });
  });
  document.getElementById('vtModalClose').addEventListener('click', close);
  modal.addEventListener('click', function(e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
})();
</script>
{% endblock %}
