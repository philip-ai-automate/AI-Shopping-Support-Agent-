<style>
  /* AI Post Designer — shared by business (base.html) and admin (admin_base.html) pages */
  .ad [hidden]{display:none!important}
  .ad{display:flex;flex-direction:column;gap:18px;max-width:1100px;--ad-ink:#030C18;--ad-muted:rgba(3,12,24,.56);--ad-line:rgba(3,12,24,.10);--ad-soft:#F5F7FA}
  .ad-title{font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--ad-ink);margin:0 0 4px}
  .ad-sub{font-size:13.5px;color:var(--ad-muted);line-height:1.5;max-width:72ch;margin:0}
  .ad-crumb{font-size:12.5px;color:var(--ad-muted)}
  .ad-crumb a{color:var(--ad-muted)}
  .ad-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ad-between{justify-content:space-between}
  .ad-panel{background:#fff;border:1px solid var(--ad-line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .ad-panel h3{margin:0;font-size:15px;color:var(--ad-ink)}
  .ad-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .ad-field{display:flex;flex-direction:column;gap:6px}
  .ad-field > label,.ad-lbl{font-size:12.5px;font-weight:700;color:var(--ad-ink)}
  .ad-field input[type=text],.ad-field input[type=password],.ad-field input[type=search],.ad-field input[type=datetime-local],.ad-field select,.ad-field textarea{font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--ad-line);border-radius:10px;background:#fff;width:100%}
  .ad-field textarea{min-height:90px;resize:vertical}
  .ad-hint{font-size:12px;color:var(--ad-muted)}
  .ad-btn-ai{background:linear-gradient(135deg,#1B2B6B,#5B2BA6)!important;color:#fff!important;border-color:transparent!important}
  .ad-btn-ai small{opacity:.8;font-weight:500}
  .ad-off{opacity:.45;pointer-events:none}
  .ad-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .ad-p-g{background:#ECFDF3;color:#027A48}.ad-p-b{background:#EFF4FF;color:#1849A9}.ad-p-n{background:#F2F4F7;color:#475467}.ad-p-w{background:#FFFAEB;color:#B54708}
  .ad-alert{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
  .ad-alert.warn{background:#FFFAEB;color:#B54708;border:1px solid rgba(181,71,8,.25)}
  .ad-alert.info{background:var(--ad-soft);border:1px solid var(--ad-line)}
  .ad-chips{display:flex;gap:8px;flex-wrap:wrap}
  .ad-chip{position:relative;display:inline-flex}
  .ad-chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .ad-chip > span,.ad-chip > button{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;border:1.5px solid var(--ad-line);border-radius:999px;padding:7px 12px;cursor:pointer;background:#fff;color:inherit}
  .ad-chip input:checked + span,.ad-chip > button.on{border-color:var(--ad-ink);background:var(--ad-ink);color:#fff}
  .ad-chip input:focus-visible + span{outline:3px solid #6AA8FF;outline-offset:2px}
  .ad-dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
  .ad-meter{display:flex;align-items:center;gap:12px;border:1px solid var(--ad-line);border-radius:14px;padding:10px 14px;background:var(--ad-soft);font-size:13px;flex-wrap:wrap}
  .ad-bar{flex:1;min-width:120px;height:8px;border-radius:999px;background:rgba(3,12,24,.08);overflow:hidden}
  .ad-bar i{display:block;height:100%;background:linear-gradient(90deg,#5B2BA6,#1B2B6B);border-radius:999px}
  .ad-meter b{font-variant-numeric:tabular-nums}
  .ad-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media (max-width:980px){.ad-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:760px){.ad-two{grid-template-columns:1fr}}
  .ad-opt{display:flex;flex-direction:column;gap:8px}
  .ad-opt img{width:100%;aspect-ratio:1/1;border-radius:10px;border:1px solid var(--ad-line);display:block;background:var(--ad-soft)}
  .ad-opt.sel img{outline:3px solid var(--ad-ink);outline-offset:3px}
  .ad-opt .cap{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ad-muted);gap:6px}
  .ad-opt form{display:inline}
  .ad-pickbtn{border:none;background:none;padding:0;cursor:pointer;display:block;width:100%}
  .ad-th{font-size:13px;padding:2px 6px;border-radius:8px;border:1px solid var(--ad-line);background:#fff;cursor:pointer;filter:grayscale(1);opacity:.6}
  .ad-th.up{filter:none;opacity:1;background:#ECFDF3;border-color:rgba(2,122,72,.3)}
  .ad-th.down{filter:none;opacity:1;background:#FEF3F2;border-color:rgba(180,35,24,.3)}
  .ad-sw{display:flex;gap:8px;flex-wrap:wrap}
  .ad-sw button{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ad-line);cursor:pointer;padding:0}
  .ad-sw button.on{box-shadow:0 0 0 2.5px var(--ad-ink)}
  .ad-restyle{display:grid;grid-template-columns:1fr auto 1fr;gap:18px}
  @media (max-width:980px){.ad-restyle{grid-template-columns:1fr}}
  .ad-prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ad-prod{position:relative;border:1.5px solid var(--ad-line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;cursor:pointer;background:#fff}
  .ad-prod input{position:absolute;opacity:0;pointer-events:none}
  .ad-prod:has(input:checked){border-color:var(--ad-ink);box-shadow:0 0 0 3px rgba(3,12,24,.08)}
  .ad-prod img,.ad-prod .ph{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--ad-soft);display:flex;align-items:center;justify-content:center;color:var(--ad-muted);font-size:11px}
  .ad-prod b{color:var(--ad-ink);font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ad-seg{display:inline-flex;align-self:flex-start;border:1.5px solid var(--ad-line);border-radius:12px;overflow:hidden}
  .ad-seg label{padding:9px 14px;font-size:13px;font-weight:650;cursor:pointer;border-right:1px solid var(--ad-line)}
  .ad-seg label:last-child{border-right:none}
  .ad-seg input{position:absolute;opacity:0;pointer-events:none}
  .ad-seg label:has(input:checked){background:var(--ad-ink);color:#fff}
  .ad-radio{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
  .ad-radio input{width:auto;margin:3px 0 0}
  .ad-previews{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .ad-previews figure{margin:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ad-muted)}
  .ad-previews img{border-radius:10px;border:1px solid var(--ad-line);max-width:100%;display:block}
  .ad-tw{overflow-x:auto}
  .ad-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .ad-table th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ad-muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--ad-line)}
  .ad-table td{padding:10px;border-bottom:1px solid var(--ad-line)}
  .ad-num{font-variant-numeric:tabular-nums}
  .ad-busy{display:none;align-items:center;gap:10px;font-size:13px;color:var(--ad-muted)}
  .ad-busy.on{display:flex}
  .ad-spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(3,12,24,.15);border-top-color:#5B2BA6;animation:adspin 0.8s linear infinite}
  @keyframes adspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ad-spin{animation:none}}
  .ad-colour{display:flex;gap:10px;align-items:center}
  .ad-colour input[type=color]{width:44px;height:36px;border:1.5px solid var(--ad-line);border-radius:8px;padding:2px;background:#fff}
</style>
