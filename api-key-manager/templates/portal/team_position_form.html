{% extends "portal/base.html" %}
{% block title %}{{ 'Edit' if position else 'New' }} Position — PhiXtra Portal{% endblock %}

{% block content %}
<div class="page" style="max-width:420px">

  <div class="page-header">
    <h1 class="section-title">{{ 'Edit Position' if position else 'New Position' }}</h1>
    <a href="{{ url_for('portal.team_positions_page') }}" class="btn btn-sm">← Back</a>
  </div>

  <form method="POST"
        action="{{ url_for('portal.team_position_edit', pos_id=position.id) if position else url_for('portal.team_position_new') }}">
    <div class="card">
      <div class="form-group">
        <label>Position / title</label>
        <input type="text" name="name" required maxlength="100" placeholder="e.g. Sales Rep, Support Agent"
               value="{{ position.name if position else '' }}"/>
      </div>
    </div>
    <div style="margin-top:16px">
      <button type="submit" class="btn btn-primary">{{ 'Save' if position else 'Create Position' }}</button>
      <a href="{{ url_for('portal.team_positions_page') }}" class="btn">Cancel</a>
    </div>
  </form>

</div>
{% endblock %}
