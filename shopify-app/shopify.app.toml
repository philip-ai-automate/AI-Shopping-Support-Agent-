# PhiXtra Shopify app settings. Pushed to Shopify with: shopify app deploy
name = "PhiXtra"
client_id = "d0bb96537310ec3905d8cb5866ef1f3a"
application_url = "https://portal.phixtra.com/shopify/app"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory,read_customers,read_companies,read_publications,write_draft_orders,write_payment_terms"

[auth]
redirect_urls = [ "https://portal.phixtra.com/shopify/callback" ]

[webhooks]
api_version = "2026-10"

# Privacy (compliance) webhooks required by Shopify.
# app/uninstalled is subscribed by the portal itself after install.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://portal.phixtra.com/shopify/webhooks"

# Part 2 (2 Nov 2026): product sync. Each change re-reads that product.
[[webhooks.subscriptions]]
topics = [ "products/create", "products/update", "products/delete", "inventory_levels/update" ]
uri = "https://portal.phixtra.com/shopify/webhooks"

# Part 4 (3 Nov 2026): recognise B2B buyers. Any company / location / contact
# / role change (or a contact's customer details) re-reads the store's companies.
[[webhooks.subscriptions]]
topics = [ "companies/create", "companies/update", "companies/delete", "company_locations/create", "company_locations/update", "company_locations/delete", "company_contacts/create", "company_contacts/update", "company_contacts/delete", "company_contact_roles/assign", "company_contact_roles/revoke", "customers/update", "customers/delete" ]
uri = "https://portal.phixtra.com/shopify/webhooks"

# Part 6 (5 Nov 2026): a won quotation becomes a Shopify draft order;
# PhiXtra follows it until it is completed or deleted.
[[webhooks.subscriptions]]
topics = [ "draft_orders/update", "draft_orders/delete" ]
uri = "https://portal.phixtra.com/shopify/webhooks"
